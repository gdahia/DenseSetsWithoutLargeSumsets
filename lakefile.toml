name = "DenseSetsWithoutLargeSumsets"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["DenseSetsWithoutLargeSumsets", "Solution"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

# Source of Sections 3 and 4 of Green's count of sets with small sumset.
[[require]]
name = "CountingSetsWithSmallSumset"
git = "https://github.com/gdahia/CountingSetsWithSmallSumset"
rev = "5f8eb1c48e91ce4131810cf4179bb60979727d64"

# Source of Chang's theorem in `ZMod q`. It brings in APAP and Tau Ceti.
[[require]]
name = "ChangFreimanRuzsa"
git = "https://github.com/gdahia/ChangFreimanRuzsa"
rev = "7637419edd2df78b5e085ee07a147166281b43ad"

# Source of Theorem 2 of Bollobás, Leader and Tiba.
[[require]]
name = "LargeSumsetsFromSubsets"
git = "https://github.com/gdahia/LargeSumsetsFromSubsets"
rev = "59e447a48e3a6430f41ab59b038c660734a115c4"

# Source of Ruzsa's lower bound for sumsets in several dimensions.
[[require]]
name = "SumOfSetsInSeveralDimensions"
git = "https://github.com/gdahia/SumOfSetsInSeveralDimensions"
rev = "3e3daad85c81610605c39c48b8f68eec41e57319"

# Last, so that its pins of the shared dependencies take precedence on `lake update`. Pinned to
# the commit TauCeti v4.35.0 pins, since Palomar requires TauCeti's exact manifest closure.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "074063781836922cb02701cd12943c9f51731afa"

# The proof development; `Solution.lean` imports it.
[[lean_lib]]
name = "DenseSetsWithoutLargeSumsets"

# The statement-only surface a reader audits. Not a default target, so that `lake build` does not
# build its `sorry`s; the comparator job builds it by name.
[[lean_lib]]
name = "Challenge"
roots = ["DenseSetsWithoutLargeSumsetsPalomar.Challenge"]

# Proves the declarations stated in `Challenge.lean`; Comparator checks the two agree.
[[lean_lib]]
name = "Solution"
roots = ["DenseSetsWithoutLargeSumsetsPalomar.Solution"]
