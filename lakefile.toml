name = "DenseSetsWithoutLargeSumsets"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["DenseSetsWithoutLargeSumsets", "Challenge", "Solution"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "APAP"
git = "https://github.com/YaelDillies/apap.git"
rev = "d88d51452d738fc9c7834002ab9c07db22effb4c"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "de5ce8a9a66a4aa68a9bdbb35b63a06d34d9ca11"

[[lean_lib]]
name = "DenseSetsWithoutLargeSumsets"

# Palomar registry submission: `Challenge` records the statement (Mathlib only),
# `Solution` proves it from the development.  See `comparator.json`.
[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"
