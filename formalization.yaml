status:
  scope: >-
    A Lean 4 formalization of the main theorem of "Dense sets without large
    sumsets", including its probabilistic construction and the estimates for
    small, moderate, and very large sumsets. The project also formalizes the
    additive-combinatorics results from Chang, Green, Ruzsa, and
    Bollobás--Leader--Tiba described in the README, together with a reduction of
    the complementary lower bound to Mathlib's Zarankiewicz function, and the
    threshold function phi(delta, N) of the paper's introduction, through which
    both directions are stated as bounds on a single quantity, including the
    upper-bound half of the paper's Corollary 1.2 and its reading at vanishing
    densities.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "DenseSetsWithoutLargeSumsets.dense_subset_without_large_sumsets"
      file: "DenseSetsWithoutLargeSumsets/DenseSubsetsWithoutLargeSumsets.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
      literature_dependencies: []
    - declaration: "DenseSetsWithoutLargeSumsets.exists_pairEvent_of_zarankiewicz_lt"
      file: "DenseSetsWithoutLargeSumsets/Combinatorics/Additive/SumsetFromZarankiewicz.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
      literature_dependencies: []
    - declaration: "DenseSetsWithoutLargeSumsets.limsup_phi_mul_log_div_log_le_three"
      file: "DenseSetsWithoutLargeSumsets/SumsetThresholdFunction.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
      literature_dependencies: []

