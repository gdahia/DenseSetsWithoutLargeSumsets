status:
  scope: >-
    A Lean 4 formalization of the main theorem of "Dense sets without large
    sumsets", including its probabilistic construction and the estimates for
    small, moderate, and very large sumsets. The project also formalizes the
    additive-combinatorics results from Chang, Green, Ruzsa, and
    Bollobás--Leader--Tiba described in the README, together with the
    complementary lower bound: every sufficiently dense subset of [n] does
    contain a large sumset. The lower bound goes through Mathlib's Zarankiewicz
    function and the Kővári--Sós--Turán estimate.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "DenseSetsWithoutLargeSumsets.dense_subset_without_large_sumsets"
      file: "DenseSetsWithoutLargeSumsets/DenseSubsetsWithoutLargeSumsets.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
      literature_dependencies: []
    - declaration: "DenseSetsWithoutLargeSumsets.exists_pairEvent_of_zarankiewicz_lt"
      file: "DenseSetsWithoutLargeSumsets/Combinatorics/Additive/SumsetFromZarankiewicz.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
      literature_dependencies: []
    - declaration: "DenseSetsWithoutLargeSumsets.pairEvent_of_lt_density"
      file: "DenseSetsWithoutLargeSumsets/Combinatorics/Additive/SumsetLowerBound.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
      literature_dependencies:
        - "doi:10.4064/cm-3-1-50-57"
    - declaration: "DenseSetsWithoutLargeSumsets.eventually_pairEvent_of_rpow_le_card"
