status:
  scope: >-
    A Lean 4 formalization of the main theorem of "Dense sets without large
    sumsets", including its probabilistic construction and the estimates for
    small, moderate, and very large sumsets. The project also formalizes the
    additive-combinatorics results from Chang, Green, Ruzsa, and
    Bollobás--Leader--Tiba described in the README. The registered statement
    lives in `Challenge.lean` and is proved in `Solution.lean`.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "dense_sets_without_large_sumsets"
      file: "Solution.lean"
      comparator_config: "comparator.json"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
      literature_dependencies: []
    - declaration: "DenseSetsWithoutLargeSumsets.dense_subset_without_large_sumsets"
      file: "DenseSetsWithoutLargeSumsets/DenseSubsetsWithoutLargeSumsets.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
      literature_dependencies: []

