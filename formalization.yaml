fidelity:
  divergences: |-
    Main theorem: The result is stated in an explicit uniform form using the
    project-defined density exponent and a fixed positive error parameter gamma.
    Unlike the paper, the formalization does not change the ambient setting of the
    small-sumset probability argument from [n] to ZMod q. It maps only the relevant
    structural subsets into ZMod q, applies the cyclic structural theorem there,
    and then uses the pullback to [n] of the resulting GAP carrier as the container.
    Thus the random set, witness pairs, and probability events remain in the
    original setting throughout.

    Chang: The formalization proves the cyclic small-doubling form needed by the
    main argument, with the progression dimension bounded by the Freiman dimension.
    Its derivation also differs from the one used in the source paper: it follows
    Chang's proof directly in the cyclic setting and transports the constructed
    progression within ZMod q. In particular, it does not use any input from the
    Cwalina--Schoen paper or the Campos--Dahia--Marciano paper. The formalization
    instead supplies its own properization and coordinate-transport stages; this
    is the source of the quantitative loss described next. Its progression-size
    estimate is quantitatively weaker than Chang's exp(O(kappa^2 (log kappa)^3))
    ratio. The formalized ratio is exp(changTheoremExponent kappa), where
    changTheoremExponent includes a quartic properization and coordinate-transport
    cost applied to the already coarse changContainerExponent budget.

    Bollobás--Leader--Tiba: The formalization replaces the paper's iterative use of
    a restricted-sumset cleanup theorem with a simpler proof based on one
    penalized-potential minimizer. In the small-sumset case it applies directly a
    small-doubling arithmetic-removal lemma; in the large-sumset case it uses an
    elementary covering estimate. The normalized theorem retains at least
    (1 - epsilon / 4) of each original set, improving the paper's (1 - epsilon)
    bound. With popularity threshold alpha = delta / (36 K), its explicit sampling
    constant is 36 / (epsilon alpha), replacing the exponential dependence on
    1 / alpha in the paper's proof by linear dependence. The published statement
    follows after a harmless rescaling of K and epsilon.

review:
  status: "self-assessed"
  reviewers:
    - "Gabriel Dahia"
    - "claude opus 5"
  notes: >-
    The declarations compile without sorries and their axiom dependencies have
    been checked. No independent mathematical peer review is recorded here.

alignment:
  namespace: "DenseSetsWithoutLargeSumsets"
  statements:
    - source: "Dense sets without large sumsets, Theorem 1.1"
      lean: "DenseSetsWithoutLargeSumsets.dense_subset_without_large_sumsets"
      module: "DenseSetsWithoutLargeSumsets.DenseSubsetsWithoutLargeSumsets"
      status: "proved"
      note: >-
        Keeps the probability argument over subsets of [n]. Images in ZMod q are
        used only to construct proper GAPs, whose carriers are pulled back along the
        model embedding to obtain containers in [n].
    - source: "Dense sets without large sumsets, Theorem 1.1, asymptotic form"
      lean: "DenseSetsWithoutLargeSumsets.limsup_phi_mul_log_div_log_le_three"
      module: "DenseSetsWithoutLargeSumsets.SumsetThresholdFunction"
      status: "proved"
      note: >-
        Restates the main theorem as the upper bound
        limsup_N phi(delta, N) log (1 / delta) / log N <= 3 on the threshold
        function phi of the paper's introduction, for every constant density
        delta in (0, 1). It is a limsup and not a liminf bound because the
        construction supplies a witness for every sufficiently large N.
    - source: "Dense sets without large sumsets, Corollary 1.2, upper bound"
      lean: "DenseSetsWithoutLargeSumsets.limsup_phi_div_log_le"
      module: "DenseSetsWithoutLargeSumsets.SumsetThresholdFunction"
      status: "proved"
      note: >-
        The phi(delta, n) / log n <= (3 + gamma) / log (1 / delta) half of
        Corollary 1.2, in the limsup form limsup_N phi(delta, N) / log N <=
        4 / log (1 / delta) at each fixed delta in (0, 1). The matching lower
        bound of Corollary 1.2 is quoted there from Hernández and Hetzel and is not
        formalized; the project instead reduces a lower bound on phi to Mathlib's
        Zarankiewicz function.
    - source: >-
        Dense sets without large sumsets, Corollary 1.2, negative answer to
        Question 4.12 of "Problems on infinite sumset configurations in the
        integers and beyond"
      lean: "DenseSetsWithoutLargeSumsets.liminf_phi_div_log_eq_zero"
      module: "DenseSetsWithoutLargeSumsets.SumsetThresholdFunction"
      status: "proved"
      note: >-
        Corollary 1.2 answers Question 4.12 of Bryna Kra, Joel Moreira,
        Florian K. Richter and Donald Robertson -- whether
        liminf_N phi(delta_N, N) / log N > 0 for some sequence delta_N -> 0 --
        in the negative. The formalization records this reading, and since phi is
        monotone in the density it holds for every sequence delta_N -> 0, not only
        those within the delta >= n^(-alpha) range of Corollary 1.2: the whole
        limit is 0. The specific sequence delta_N = 1 / log N of that question is
        liminf_phi_logDensity_div_log_eq_zero, with the rate
        phi(1 / log N, N) < 4 log N / log log N given by
        eventually_phi_logDensity_lt_log_div_log_log.
    - source: "A polynomial bound in Freiman's theorem, proper-GAP consequence"
      lean: "DenseSetsWithoutLargeSumsets.exists_properGAP_of_small_sumset"
      module: "DenseSetsWithoutLargeSumsets.Combinatorics.Additive.Chang.Reduction"
      status: "proved"
      note: >-
        Cyclic small-doubling form used by the main proof. Its derivation follows
        Chang's argument while remaining in ZMod q, without an integer pullback or
        inputs from Cwalina--Schoen. The dimension bound is preserved, but the
        progression-size exponent is worse because the coarse container budget is
        followed by the formalization's quartic properization and transport costs.
    - source: "Counting sets with small sumset, Sections 3 and 4"
      lean: "DenseSetsWithoutLargeSumsets.exists_smallRestrictedSumsetFreimanClassCover"
      module: "DenseSetsWithoutLargeSumsets.Combinatorics.Additive.SmallSumsetIsomorphismClasses.ClassCountBounds"
      status: "proved"
      note: >-
        Representative result from the development of relation classes, core
        decompositions, dimension bounds, and realization counts.
    - source: "Sum of sets in several dimensions, main sharp lower bound"
      lean: "DenseSetsWithoutLargeSumsets.card_add_lower_bound_of_affineDim"
      module: "DenseSetsWithoutLargeSumsets.Combinatorics.Additive.SumOfSetsInSeveralDimensions"
      status: "proved"
    - source: "Large sumsets from medium-sized subsets, Theorem 2"
      lean: "DenseSetsWithoutLargeSumsets.exists_medium_sized_subsets_with_large_sumset_subsets"
      module: "DenseSetsWithoutLargeSumsets.Combinatorics.Additive.LargeSumsetsFromMediumSizedSubsets.MediumSizedSubsets"
      status: "proved"
      note: >-
        Uses a single penalized-potential minimizer, direct small-doubling arithmetic
        removal, and an elementary covering argument. The normalized result retains
        a (1 - epsilon / 4)-fraction and has sampling constant
        36 / (epsilon alpha) for alpha = delta / (36 K).

acknowledgements: >-
  Built on Mathlib and the APAP project; APAP supplies additive-combinatorics
  and discrete-Fourier-analysis infrastructure used in the proof of the weak
  version of Chang's theorem.
