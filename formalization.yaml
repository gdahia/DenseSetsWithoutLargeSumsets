# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Dense sets without large sumsets"
  description: >-
    Lean 4 formalization of Dahia, Marciano and Souza's theorem that for 0 < δ < 1 and all
    large n there is S ⊆ {1, ..., n} with |S| ≥ δn that contains no sumset A + B with
    min{|A|, |B|} ≥ (3 + o(1)) log n / log(1/δ), for n^(-α) < δ ≤ 1 - c, together with the
    bound for a δ-random subset that it follows from. It includes Corollary 1.2 of the paper on
    the function φ(δ, N) of Kra, Moreira, Richter and Robertson:
    (1 - γ)/log(1/δ) ≤ φ(δ, n)/log n ≤ (3 + γ)/log(1/δ). The lower bound is that of Hernández
    and Hetzel, and is proved here from the Kővári-Sós-Turán theorem. Conjecture 4.10 of Kra,
    Moreira, Richter and Robertson and the negative answer to their Question 4.12 follow.
  authors:
    - "Gabriel Dahia"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Gabriel Dahia"

classification:
  arxiv: ["math.CO", "math.NT"]
  msc2020: ["11B13", "11B30", "05D40", "11P70"]

sources:
  - title: "Dense sets without large sumsets"
    authors:
      - "Gabriel Dahia"
      - "João Pedro Marciano"
      - "Victor Souza"
    id: "https://arxiv.org/abs/2607.15269v1"
    type: "paper"
    location: "https://arxiv.org/abs/2607.15269v1"
    relationship: "formalizes"
    note: "Theorems 1.1 and 1.3 and Corollary 1.2."
    license: "CC-BY-4.0"
    author_endorsement: "participated"
  - title: "On growth rates of infinite and finite sumsets"
    authors:
      - "Felipe Hernández"
      - "Luke Hetzel"
    id: "https://arxiv.org/abs/2606.07310"
    type: "paper"
    location: "https://arxiv.org/abs/2606.07310"
    relationship: "independently-proves"
    note: >-
      Corollary C: 1/log(1/δ) ≤ liminf φ(δ, N)/log N for fixed 0 < δ < 1. The paper quotes it
      for the lower bound of Corollary 1.2. The statement is formalized, with a proof from the
      Kővári-Sós-Turán theorem and not from the finitary intersectivity lemma of Hernández and
      Hetzel. Their other results are not formalized.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Problems on infinite sumset configurations in the integers and beyond"
    authors:
      - "Bryna Kra"
      - "Joel Moreira"
      - "Florian K. Richter"
      - "Donald Robertson"
    id: "https://doi.org/10.1090/bull/1868"
    type: "paper"
    location: "https://arxiv.org/abs/2311.06197"
    relationship: "background"
    note: >-
      Bull. Amer. Math. Soc. 62 (2025), 537-574. Source of the function φ(δ, N), of
      Conjecture 4.10 and of Question 4.12 (Section 4.3).
  - title: "On a problem of K. Zarankiewicz"
    authors:
      - "Tamás Kővári"
      - "Vera T. Sós"
      - "Pál Turán"
    id: "https://doi.org/10.4064/cm-3-1-50-57"
    type: "paper"
    relationship: "background"
    note: >-
      Colloq. Math. 3 (1954), 50-57. The Lean proof is the one of Mitchell Horner in the
      Mathlib pull request 25841; see related_formalizations.
  - title: "A polynomial bound in Freiman's theorem"
    authors:
      - "Mei-Chu Chang"
    id: "https://doi.org/10.1215/S0012-7094-02-11331-3"
    type: "paper"
    relationship: "background"
    note: >-
      Used for subsets of ZMod q, with a proper progression of dimension at most the Freiman
      dimension. It is proved in ChangFreimanRuzsa.
  - title: "Counting sets with small sumset, and the clique number of random Cayley graphs"
    authors:
      - "Ben Green"
    id: "https://doi.org/10.1007/s00493-005-0018-2"
    type: "paper"
    relationship: "background"
    note: >-
      Combinatorica 25 (2005), 307-326. Sections 3 and 4, on Freiman isomorphism classes of
      sets with small sumset, are formalized here.
  - title: "Sum of sets in several dimensions"
    authors:
      - "Imre Z. Ruzsa"
    id: "https://doi.org/10.1007/BF01302969"
    type: "paper"
    relationship: "background"
    note: "Combinatorica 14 (1994), 485-490. The lower bound is proved in SumOfSetsInSeveralDimensions."
  - title: "Large sumsets from medium-sized subsets"
    authors:
      - "Béla Bollobás"
      - "Imre Leader"
      - "Marius Tiba"
    id: "https://arxiv.org/abs/2206.09366"
    type: "paper"
    relationship: "background"
    note: "Theorem 2 is proved in LargeSumsetsFromSubsets."

related_formalizations:
  - id: "https://github.com/leanprover-community/mathlib4"
    relationship: "builds-on"
    note: >-
      The statements use finite sets of natural numbers, pointwise sums, the unit interval,
      logarithms and real powers, the distribution setBernoulli of a random subset, and limits
      inferior and superior in the reals and the extended reals. The proofs use its Freiman isomorphisms, the Plünnecke-Ruzsa
      inequality, the binomial distribution, Bertrand's postulate and the Zarankiewicz
      function.
  - id: "https://github.com/gdahia/ChangFreimanRuzsa"
    relationship: "builds-on"
    note: >-
      A Lake dependency and the source of Chang's theorem in ZMod q with a t-proper progression
      of dimension at most the Freiman dimension,
      ChangFreimanRuzsa.exists_tProperGAP_zmod_dim_le_freimanDim, used for t = 2, and of
      generalized arithmetic progressions, ChangFreimanRuzsa.GAP. It uses Chang's lemma on large spectra
      from https://github.com/YaelDillies/apap and Minkowski's second theorem from
      https://github.com/TauCetiProject/TauCeti.
  - id: "https://github.com/gdahia/LargeSumsetsFromSubsets"
    relationship: "builds-on"
    note: >-
      A Lake dependency and the source of Theorem 2 of Bollobás, Leader and Tiba,
      LargeSumsetsFromSubsets.exists_subset_card_le_mul_sqrt_min_le_card_add, used for small
      sumsets.
  - id: "https://github.com/gdahia/SumOfSetsInSeveralDimensions"
    relationship: "builds-on"
    note: >-
      A Lake dependency and the source of the Freiman dimension, of Ruzsa's lower bound for
      sumsets of sets of given Freiman dimension, used for small sumsets, and of the bound
      freimanDim_le_two_mul_sub_one_of_card_add_le.
  - id: "https://github.com/gdahia/CountingSetsWithSmallSumset"
    relationship: "builds-on"
    note: >-
      A Lake dependency and the source of Lemma 11, Proposition 18 and the bound for the
      members of a Freiman isomorphism class in an interval from the proof of Proposition 23
      of Green's paper. They give the counts of sets of natural numbers of given Freiman
      dimension in CountingSumsetsOfModerateSize.BoundedFreimanDimSets, used for moderate
      sumsets.
  - id: "https://github.com/leanprover-community/mathlib4/pull/25841"
    relationship: "adapts"
    note: >-
      The Kővári-Sós-Turán theorem, by Mitchell Horner, used for the lower bound of
      Corollary 1.2. The file Mathlib/Combinatorics/SimpleGraph/Extremal/KovariSosTuran.lean
      of the pull request at commit 1ed83fcfe430778431dfa20c92663db040a98772 is in
      DenseSetsWithoutLargeSumsets/Mathlib/, with the four lemmas that the pull request adds
      to Mathlib/Combinatorics/SimpleGraph/Bipartite.lean, to be deleted when Mathlib has the
      theorem.

status:
  scope: >-
    Theorem 1.1, Theorem 1.3 (the bound for a δ-random subset) and Corollary 1.2 of the paper,
    Corollary C of Hernández and Hetzel, Conjecture 4.10 of Kra, Moreira, Richter and Robertson
    for 0 < δ < 1, and the negative answer to their Question 4.12. The
    finitistic intersectivity lemma of Hernández and Hetzel (their Theorem B) and its
    generalization are not formalized. No statement takes a cited theorem as a hypothesis. Chang's theorem, Theorem 2 of Bollobás, Leader and
    Tiba, Ruzsa's lower bound and the results of Sections 3 and 4 of Green's paper are proved
    in the Lake dependencies listed under related_formalizations. The reduction of the lower
    bound to the Kővári-Sós-Turán theorem is proved here. Question 4.11 of Kra,
    Moreira, Richter and Robertson, on the existence of the limit of φ(δ, N)/log N, is not
    addressed. The sorry counts refer to the library and Solution.lean; Challenge.lean has
    one placeholder for each of its six statements.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

automation:
  methods:
    - method: "agent"
      models: ["gpt-5.6 sol high", "claude opus 5"]
      framework: "Codex"
      tool_setup: >-
        Codex agents guided by an AGENTS.md file, with Lean proofs checked in the pinned Lake
        environment.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: >-
        The proof of Theorem 1.1 and of the results it uses, up to commit 5f4b915, and first
        versions of the function φ, of its upper bounds and of the reduction of the lower
        bound to the Zarankiewicz function, on branches of the repository.
    - method: "agent"
      models: ["Claude Opus 5.5"]
      framework: "Claude Code"
      tool_setup: >-
        Lean 4, Mathlib, shell, the arXiv sources of the paper and of the papers of Hernández
        and Hetzel and of Kra, Moreira, Richter and Robertson, and the branches of this
        repository.
      cost:
        wall_time: "six sessions"
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: >-
        One instruction to repeat the Palomar setup of the author's other repositories, to
        move to their Lean version, to take Chang's theorem, the theorem of Bollobás, Leader
        and Tiba and Ruzsa's bound from the repositories that now hold them, and to bring in
        from the branches the statements and proofs about φ, including the bound of
        Hernández and Hetzel. Then one instruction to move the bound of the dimension to
        ChangFreimanRuzsa, to rewrite the modules written by Codex in the style of the
        others, and to state the solution of the conjectures in Challenge.lean. The second
        used one subagent for each group of files. Then two instructions to move Green's
        Sections 3 and 4 to a repository of their own and the Freiman dimension to
        SumOfSetsInSeveralDimensions. Then one instruction to take ChangFreimanRuzsa from
        GitHub and to follow the author's Palomar conventions. Then one instruction to follow
        the author's Palomar submission standards. Then one instruction to move here from
        CountingSetsWithSmallSumset the counts of sets of natural numbers that Green does not
        state, and to take CountingSetsWithSmallSumset from GitHub. Later, one instruction to
        follow the author's Palomar submission standards, and a second in the same session to
        state in Challenge.lean the finitary results of Hernández and Hetzel and the resolution
        of the conjectures. Later, one instruction to follow the author's Palomar submission
        standards, to stay on Lean v4.35.0 and to move to the latest compatible versions of the
        dependencies, and then to keep in Challenge.lean the main theorems of the paper and the
        results of Hernández and Hetzel needed for the questions of Kra, Moreira, Richter and
        Robertson, in the form in which they were asked, with phi as its only definition.
  spend_usd: "not tracked"
  notes: >-
    The proofs up to commit 5f4b915 were written by Codex agents directed by Gabriel Dahia.
    Claude Code, directed by Gabriel Dahia, ported the repository to Lean v4.35.0-rc4,
    replaced the modules that the three dependencies now provide, ported and rewrote the
    modules on φ and on the Zarankiewicz function from the branches, proved the lower bound
    of Corollary 1.2, Corollary C of Hernández and Hetzel and Conjecture 4.10, and wrote
    Challenge.lean, Solution.lean and this file. In a second session it moved the bound of
    the dimension by the Freiman dimension to ChangFreimanRuzsa and rewrote the proofs and
    the documentation of the modules written by Codex, without changing the definitions or
    the main statements; the rewritten proofs follow the same arguments and are about half
    as long. In a third session it moved the repository to Lean v4.35.0, took
    ChangFreimanRuzsa and SumOfSetsInSeveralDimensions from GitHub, adapted the proofs to the
    renamed exponents of ChangFreimanRuzsa, renamed the library theorems after the
    statements of Challenge.lean, gave the statements of Challenge.lean and Solution.lean
    primed names, and minimized the imports. In a fourth session it moved Challenge.lean and
    Solution.lean to DenseSetsWithoutLargeSumsetsPalomar/, moved card_boundedFreimanDimSets
    and smallSumsetFreimanDimSets_ncard_le here from CountingSetsWithSmallSumset, and moved
    to its public version on GitHub. Later, the agent stated in Challenge.lean Lemma 2.1,
    Theorem 3.1, Corollary 3.3, Lemma 4.1 and Corollary 4.3 of the paper, Theorem 1.3 with the
    random set distributed as setBernoulli, the forms of Corollary C of Hernández and Hetzel
    for all large N, and further forms of Conjecture 4.10 and Question 4.12; added the library
    theorems with these statements; reduced the imports of Challenge.lean to one Mathlib
    module; and left Challenge out of the default build targets. Later, the agent moved to the
    latest commits of the four dependencies and to the Mathlib commit that Tau Ceti v4.35.0
    pins, fixed one proof of CountingSetsWithSmallSumset for that commit upstream, adapted the
    proofs to the progressions of ChangFreimanRuzsa, now given by an origin and a bound, and to
    the constants of LargeSumsetsFromSubsets, which no longer take proofs, and reduced Challenge.lean to Theorems 1.1 and 1.3 and Corollary 1.2 of the paper,
    Corollary C of Hernández and Hetzel, Conjecture 4.10 and Question 4.12 as asked, stated
    with Mathlib notions and phi, whose library definition it now shares. Every proof is
    checked by Lean.

fidelity:
  divergences: >-
    Theorem 1.1. The exponent α is denseSubsetDensityExponent γ c in the library and is
    existentially quantified in Challenge.lean. The sets A and B range over subsets of
    {1, ..., n}; the paper takes them in the positive integers, and a sumset of sets of
    positive integers contained in S ⊆ {1, ..., n} has both summands in {1, ..., n}.

    Corollary 1.2. φ(δ, N) is phi δ N for δ in the unit interval, defined as the supremum of
    the set of admissible k, which is attained. The exponent α is existentially quantified.
    The lower bound is quoted in the paper from Hernández and Hetzel, whose Corollary C is for
    fixed δ; here it is stated for n^(-α) ≤ δ ≤ 1 - c, uniformly in δ.

    Theorem 1.3. The paper states that the probability tends to 0, with
    k = (3 + γ) log n / log(1/δ) and A, B ⊆ ℕ. Here k is rounded up, A and B range over subsets
    of {1, ..., n}, and the probability is at most 4 k^2 / n^(γ / (8 (γ + 3))). The random set
    has distribution setBernoulli (Set.Icc 1 n) δ, and the event is the image of a family of
    finite sets. The exponent α is denseSubsetDensityExponent γ c in the library and is
    existentially quantified in Challenge.lean.

    Conjecture 4.10 is stated by Kra, Moreira, Richter and Robertson for every δ > 0. It is
    false for δ = 1, where φ(1, N) = ⌊N/2⌋, and is formalized for 0 < δ < 1, as in Hernández
    and Hetzel. Both limits are taken in the extended reals, so that limsup < ∞ and
    liminf > 0 are the assertions of the conjecture; the bound 1/log(1/δ) ≤ liminf of
    Hernández and Hetzel is stated with the real limit. Question 4.12 is answered for every
    sequence δ_N → 0 with values in the unit interval.

review:
  status: "unchecked"
  reviewers: []
  notes: "Unreviewed"

alignment:
  namespace: "DenseSetsWithoutLargeSumsets"
  statements:
    - source: "Dense sets without large sumsets, Theorem 1.1"
      lean: "DenseSetsWithoutLargeSumsets.exists_dense_subset_forall_add_not_subset'"
      module: "DenseSetsWithoutLargeSumsetsPalomar.Challenge"
      status: "proved"
      note: >-
        Library forms: exists_dense_subset_forall_add_not_subset,
        eventually_forall_exists_dense_subset_without_large_sumsets and
        dense_subset_without_large_sumsets in
        DenseSetsWithoutLargeSumsets.DenseSubsetsWithoutLargeSumsets.
    - source: "Dense sets without large sumsets, Corollary 1.2"
      lean: "DenseSetsWithoutLargeSumsets.exists_forall_phi_div_log_mem_Icc'"
      module: "DenseSetsWithoutLargeSumsetsPalomar.Challenge"
      status: "proved"
      note: >-
        Library form: exists_forall_phi_div_log_mem_Icc in
        DenseSetsWithoutLargeSumsets.SumsetThreshold.Growth.
    - source: "Dense sets without large sumsets, Theorem 1.3"
      lean: "DenseSetsWithoutLargeSumsets.exists_forall_setBernoulli_real_pairEvent_le'"
      module: "DenseSetsWithoutLargeSumsetsPalomar.Challenge"
      status: "proved"
      note: >-
        With the explicit bound 4 k^2 / n^(γ / (8 (γ + 3))) for the probability, where
        k = ⌈(3 + γ) log n / log(1/δ)⌉. Library forms:
        exists_forall_setBernoulli_real_pairEvent_le and, with the explicit exponent,
        eventually_pairEvent_probability_le in
        DenseSetsWithoutLargeSumsets.DenseSubsetsWithoutLargeSumsets.
    - source: "On growth rates of infinite and finite sumsets, Corollary C"
      lean: "DenseSetsWithoutLargeSumsets.one_div_log_one_div_le_liminf_phi_div_log'"
      module: "DenseSetsWithoutLargeSumsetsPalomar.Challenge"
      status: "proved"
      note: >-
        Proved from the Kővári-Sós-Turán theorem, not by the argument of Hernández and
        Hetzel.
    - source: >-
        Problems on infinite sumset configurations in the integers and beyond,
        Conjecture 4.10
      lean: "DenseSetsWithoutLargeSumsets.limsup_phi_div_log_lt_top_and_liminf_phi_div_log_pos'"
      module: "DenseSetsWithoutLargeSumsetsPalomar.Challenge"
      status: "proved"
      note: >-
        For 0 < δ < 1, with the limits in the extended reals. Library form:
        limsup_phi_div_log_lt_top_and_liminf_phi_div_log_pos in
        DenseSetsWithoutLargeSumsets.SumsetThreshold.Growth.
    - source: >-
        Problems on infinite sumset configurations in the integers and beyond,
        Question 4.12
      lean: "DenseSetsWithoutLargeSumsets.liminf_phi_div_log_eq_zero'"
      module: "DenseSetsWithoutLargeSumsetsPalomar.Challenge"
      status: "proved"
      note: >-
        The answer is negative: liminf φ(δ_N, N)/log N = 0 for every δ_N → 0. Library form:
        liminf_phi_div_log_eq_zero in
        DenseSetsWithoutLargeSumsets.SumsetThreshold.VanishingDensity.

acknowledgements: >-
  Lean 4 and Mathlib; APAP and Tau Ceti, through ChangFreimanRuzsa; Mitchell Horner's proof of
  the Kővári-Sós-Turán theorem; the Palomar registry template.
